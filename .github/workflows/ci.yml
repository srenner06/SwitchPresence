name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Pinned, not detected: publish.ps1 defaults to the host architecture, which is right on a
  # developer's machine and wrong here - an artifact labelled win-x64 must actually be x64,
  # whatever GitHub's runner image happens to be.
  RID: win-x64

jobs:
  build:
    # Windows-only app, and NativeAOT needs the MSVC linker that this image already has.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build SwitchPresence.slnx --configuration Release

      - name: Test
        run: dotnet test tests/SwitchPresence.Tests --configuration Release --no-build

      # Catches AOT and trimming breakage, which a normal build does not see.
      - name: Publish (NativeAOT)
        run: ./publish.ps1 -Runtime $env:RID -Configuration Release
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: switch-presence-${{ env.RID }}
          path: publish/${{ env.RID }}/*.exe
          if-no-files-found: error
